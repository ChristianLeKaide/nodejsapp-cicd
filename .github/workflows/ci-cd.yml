name: CI/CD Pipeline

on:
  push:
    branches-ignore:
      - main          # push sur main géré via merge (pull_request closed)
  pull_request:
    branches:
      - main          # PR vers main

jobs:

  # ──────────────────────────────────────────────
  # JOB 1 : Tests unitaires
  # Déclencheur : push sur n'importe quelle branche (hors main)
  # ──────────────────────────────────────────────
  unit-tests:
    name:  Tests unitaires
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]   # matrice multi-versions Node.js

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Exécution des tests unitaires
        run: npm test

  # ──────────────────────────────────────────────
  # JOB 2 : Analyse statique du code (ESLint + Semgrep)
  # Déclencheur : uniquement sur PR vers main
  # ──────────────────────────────────────────────
  static-analysis:
    name:  Analyse statique du code
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Analyse ESLint
        run: npm run lint || true   # ne bloque pas si eslint n'est pas configuré

      # BONUS : Semgrep
      - name: Analyse Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/nodejs
            p/owasp-top-ten
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true   # non bloquant si token absent

  # ──────────────────────────────────────────────
  # JOB 3 : Scan de sécurité (Trivy)
  # Déclencheur : uniquement sur PR vers main
  # ──────────────────────────────────────────────
  security-scan-pr:
    name:  Scan de sécurité (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      # BONUS : Trivy sur le système de fichiers (avant build Docker)
      - name: Scan Trivy sur le code source
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'            # 0 = non bloquant, mettre 1 pour bloquer
          severity: 'CRITICAL,HIGH'

  # ──────────────────────────────────────────────
  # JOB 4 : Pipeline complet (build + Docker + push)
  # Déclencheur : merge dans main (push sur main)
  # On simule le "merge dans main" via un push direct sur main
  # ──────────────────────────────────────────────
  full-pipeline:
    name:  Pipeline complet (build + Docker)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      # Tests unitaires
      - name: Exécution des tests unitaires
        run: npm test

      # Analyse statique
      - name: Analyse ESLint
        run: npm run lint || true

      # BONUS : Hadolint (lint Dockerfile)
      - name: Analyse Hadolint du Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
        continue-on-error: true

      # Build de l'application
      - name: Build de l'application
        run: npm run build --if-present

      # Build image Docker
      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extraction des métadonnées Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/nodejsapp-cicd
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build et push de l'image Docker
        id: docker-build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Affichage du checksum (digest) de l'image
      - name: Affichage du digest de l'image Docker
        run: |
          echo " Image poussée avec succès !"
          echo " Digest (checksum) : ${{ steps.docker-build.outputs.digest }}"
          echo "  Tags : ${{ steps.meta.outputs.tags }}"

      # BONUS : Trivy sur l'image Docker construite
      - name: Scan de sécurité Trivy sur l'image Docker
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/nodejsapp-cicd:latest
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'